name: code-metrics-scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  code-metrics:
    name: Code metrics scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout code-metrics-action
        uses: actions/checkout@v4
        with:
          repository: openlibing-test/code-metrics-action
          ref: summary-english-for-github
          token: ${{ secrets.ROBOT_TOKEN }}
          path: .code-metrics-action

      - name: Run code metrics scan
        uses: ./.code-metrics-action
        with:
          # 排除插件仓 checkout 目录与 vendor 内的第三方插件 bundle，仅统计本仓代码
          exclude-dirs: ".code-metrics-action,vendor"

      - name: Show step summary
        # GITHUB_STEP_SUMMARY 每个 step 独立，改为读取 runner 临时目录下所有 step_summary 文件
        # 以核对插件步骤写入的摘要内容是否为全英文
        run: |
          ls -la "$RUNNER_TEMP/_runner_file_commands/" || true
          cat "$RUNNER_TEMP"/_runner_file_commands/step_summary_* 2>/dev/null || true
