name: code-metrics-scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  code-metrics:
    name: Code metrics scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run code metrics scan
        uses: openlibing-test/code-metrics-action@github-actions-adaptation
        with:
          min-lines: "10"