name: code-metrics-scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  code-metrics:
    name: Code metrics scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout code-metrics-action
        uses: actions/checkout@v4
        with:
          repository: openlibing-test/code-metrics-action
          ref: test
          token: ${{ secrets.ROBOT_TOKEN }}
          path: .code-metrics-action

      - name: Run code metrics scan
        uses: ./.code-metrics-action
        with:
          # 排除插件仓 checkout 目录，仅统计本仓代码
          exclude-dirs: ".code-metrics-action"
