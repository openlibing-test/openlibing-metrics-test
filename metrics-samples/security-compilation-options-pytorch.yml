name: security-compilation-options-pytorch

on:
  workflow_dispatch:

# OIDC 联邦认证：允许插件获取流水线 OIDC ID Token 换取华为云 STS 临时凭证
permissions:
  id-token: write

jobs:
  build:
    name: scan-artifacts
    runs-on: ["codearts-hosted", "ubuntu-latest", "x64", "small"]
    steps:
      - name: Checkout
        uses: checkout
        with:
          token: ${{ secrets.GC_TOKEN }}

      # ===== 批量下载两个架构的构建产物 =====
      - name: download-artifacts
        id: download-artifacts
        uses: obs-download
        with:
          endpoint: "obs.cn-north-4.myhuaweicloud.com"
          bucket: "pytorch-package"
          key: |
            cache/master/pytorchmaster_3.10_aarch64.tar.gz
            cache/master/pytorchmaster_3.10_x86_64.tar.gz
          path: "./artifacts/"
          file-concurrency: "2"

      # ===== 扫描指定产物并上传结果 =====
      # artifact-path 精确指定只扫描这两个包，避免误扫目录中其他产物
      # artifact-download-url 以 / 结尾视为URL前缀，插件自动拼接产物文件名
      - name: security-compilation-options-scan
        uses: openlibing/security-compilation-options-action@sync-plugin-src-layout
        with:
          artifact-path: |
            ./artifacts/pytorchmaster_3.10_aarch64.tar.gz
            ./artifacts/pytorchmaster_3.10_x86_64.tar.gz
          artifact-download-url: "https://pytorch-package.obs.cn-north-4.myhuaweicloud.com/cache/master/"